name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://promosikan:placeholder@localhost:5432/promosikan?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile --no-optional
      - run: bun run db:generate
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
