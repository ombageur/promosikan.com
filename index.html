    <script>
      // Domain utama: promosikan.com. Domain bawaan Firebase dialihkan dengan path yang sama.
      if (/\.(web\.app|firebaseapp\.com)$/.test(location.hostname)) {
        location.replace("https://promosikan.com" + location.pathname + location.search + location.hash);
      }
    </script>
    <title>Promosikan.com — Temukan yang Butuh. Tawarkan yang Tepat.</title>
